# The dataset a cotral-maintenance run reads: every input file, where it came from, and its sha256.
#
# `cotral inputs check` verifies the files here against their sha256; `cotral inputs fetch` gets a missing
# file from its `url` (and refuses it when the bytes differ: a "latest" URL has moved on, and the pinned
# bytes are the ones in this repository). For another city or operator: a repository like this one with
# its own GTFS feed, OSM extracts covering its network, and reference images of its stop signs.
#
# role:  gtfs        the operator's GTFS feed, zipped (unzipped into GTFS_COTRAL/ by `cotral inputs fetch`)
#        osm         OpenStreetMap extracts covering the network (`cotral osm build` reads them all)
#        sign        the explorer's reference image of the operator's stop sign
#        lookalike   images of signs the explorer must not take for a stop sign
#        reference   ground truth for experiments, not read by the pipeline
# file:  relative to this file
# data_date: when the data was current; retrieved: when it was downloaded

name = "cotral-2026-11"
description = "Cotral (Lazio, Italy): the GTFS feed of 2026-10-28 and the OSM extracts of 2026-11-06"

